px;font-size:20px}.detail .primary{flex:1}.controls{margin-left:auto;display:flex;flex-direction:column;gap:8px}.controls button{background:#fff;width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--line);border-radius:6px;font-size:24px}.timeline{display:flex;align-items:center;justify-content:space-between;margin:23px 0 18px;position:relative}.timeline:before{content:'';position:absolute;left:7px;right:7px;top:5px;height:3px;background:#dce6dc}.station{position:relative;font-size:10px;padding-top:20px;max-width:80px;line-height:1.4}.station:before{content:'';position:absolute;top:0;left:0;width:9px;height:9px;background:#fff;border:2px solid #698a7c;border-radius:50%}.station.current:before{background:var(--red);border-color:var(--red);box-shadow:0 0 0 4px #fae1e2}.station:last-child{text-align:right}.station:last-child:before{left:auto;right:0}.alert{background:#fff6e6;border:1px solid #e4cd9c;border-radius:6px;padding:12px;font-size:12px;line-height:1.5;margin:14px 0}.success{background:#eaf2e9;border-color:#ccdfca}.listrow{border-bottom:1px solid var(--line);padding:17px 0}.listrow:last-child{border-bottom:0}.amount{font-size:38px;font-weight:750;letter-spacing:-1.5px;margin:14px 0 22px}.modalback{position:fixed;inset:0;background:#10242170;z-index:10;display:grid;place-items:center;padding:20px}.modal{background:#fff;border-radius:13px;width:100%;max-width:440px;padding:25px;max-height:85dvh;overflow:auto}.modal label{display:block;margin:18px 0 6px;font-size:12px;font-weight:650}.modal input,.modal select{border:1px solid #b5c3bb;border-radius:5px;padding:12px;width:100%;background:white;min-height:44px}.close{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%}.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:15px 20px;border-radius:7px;z-index:20;max-width:90vw;font-size:13px;box-shadow:0 5px 20px #0002}.statebar{display:fle tro-symbol.png" alt=""><span class="wordmark-plate"><img class="metro-wordmark" src="assets/metro-wordmark.png" alt="Lanka Metro Transit"></span></div><div class="headertext">YOUR EVERYDAY JOURNEY</div><div class="spacer"></div><span class="pill demo">DESIGN CONCEPT · SAMPLE DATA</span><button class="guest" onclick="account()" aria-label="Open account"><span class="avatar" id="usericon"></span><span id="guestlabel">Explore as guest</span></button></header><div class="layout"><nav aria-label="Main navigation" id="nav"></nav><main class="panel" id="panel" tabindex="-1"></main><section class="maparea" id="maparea" aria-label="Route map and selected bus"></section></div><div id="rideDock"></div><div id="modalroot"></div><div id="toast" role="status" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s),ic=n=>`<svg class="icon" aria-hidden="true"><use href="#i-${n}"/></svg>`;
let saved;try{saved=JSON.parse(localStorage.getItem('metroConcept')||'{}')}catch{saved={}}
let state={tab:'explore',period:'morning',view:'map',accessible:false,selected:0,trip:false,search:false,zoom:1,arrival:'approaching',...saved};let profile=saved.profile||'',commutes=saved.commutes||[],balance=saved.balance??700,remind=saved.remind||false,reported=saved.reported||'',large=saved.large||false;
const routes=[{id:'CM05',from:'Battaramulla',to:'Ekala',via:'Koswatta · Kaduwela · Kadawatha',time:'6:30',mins:6,crowd:'Seats available',access:true,color:'#137568',bus:'MT 052',delay:0},{id:'CM05',from:'Battaramulla',to:'Ekala',via:'Koswatta · Kaduwela · Kadawatha',time:'6:50',mins:26,crowd:'Standing room',access:true,color:'#137568',bus:'MT 054',delay:4},{id:'CM01',from:'Makumbura',to:'Colombo Fort',via:'Maharagama · Nugegoda · Town Hall',time:'6:40',mins:16,crowd:'Busy',access:false,color:'#00759e',bus:'MT 012',delay:0},{id:'CM03',from:'Makumbura',to:'Kadawatha',via:'Kottawa · Kaduwela',time:'6:45',mins:21,crowd:'Seats available',access:true,color:'#8d2458',bus:'MT 031',delay:2},{id:'CM04',from:'Panadura',to:'Dematagoda',via:'Moratuwa · Colombo',time:'7:00',mins:36,crowd:'Seats available',access:true,color:'#a84e13',bus:'MT 041',delay:0},{id:'CM02',from:'Millennium City',to:'Colombo',via:'Illustrative stop sequence',time:'7:10',mins:46,crowd:'Unknown',access:false,color:'#77661d',bus:'MT 021',delay:0},{id:'CM06',from:'Kollupitiya',to:'Circular route',via:'Illustrative stop sequence',time:'7:20',mins:56,crowd:'Unknown',access:true,color:'#50742a',bus:'MT 061',delay:0},{id:'CM08',from:'Kahathuduwa',to:'Pettah',via:'Illustrative stop sequence',time:'7:30',mins:66,crowd:'Seats available',access:true,color:'#14634c',bus:'MT 081',delay:0}];
function persist(){try{localStorage.setItem('metroConcept',JSON.stringify({profile,commutes,balance,remind,reported,large}))}catch{}}function toast(t){$('#toast').className='toast';$('#toast').textContent=t;clearTimeout(window.to);window.to=setTimeout(()=>{$('#toast').className='';$('#toast').textContent=''},4200)}
function setTab(t){state.tab=t;state.search=false;render()}function selectBus(i){state.selected=i;render()}function period(p){state.period=p;state.selected=0;render()}function dir(r){return state.period==='evening'?{from:r.to,to:r.from}:r}function routeTitle(r){let d=dir(r);return `${d.from} → ${d.to}`}function time(r){return state.period==='evening'?(r===routes[0]?'5:30':'5:50')+' PM':r.time+' AM'}function modal(title,body){$('#modalroot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-label="${title}"><div class="between"><h2>${title}</h2><button class="close" onclick="closeModal()" aria-label="Close dialog">${ic('close')}</button></div>${body}</section></div>`;setTimeout(()=>$('#modalroot button').focus(),0)}function closeModal(){$('#modalroot').innerHTML=''}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function routeCard(r,i){let d=dir(r);let arrival=i===0?state.arrival:'approaching';return `<button class="card routecard ${i===state.selected?'selected':''}" onclick="selectBus(${i})" aria-label="${routeTitle(r)}, ${arrival==='arrived'?'at stop':arrival==='passed'?'departed':r.mins+' minutes'}"><div class="between"><div class="row"><span class="routebadge" style="background:${r.color}">${r.id}</span><b>Towards ${d.to}</b></div><div class="time">${arrival==='arrived'?'Here':arrival==='passed'?'Left':r.mins}${arrival==='approaching'?'<small> min</small>':''}</div></div><div class="between" style="margin-top:9px"><span class="tiny">${r.bus} · ${time(r)}</span><span class="${r.delay?'tiny':'live'}">${r.delay?'+'+r.delay+' min delayed':'<span class="dot"></span> On time'}</span></div><div class="meta"><span>${ic('people')}${r.crowd}</span><span>${ic('access')}${r.access?'Low-floor bus':'Access unverified'}</span></div></button>`}
function home(){let d=dir(routes[0]);return `<div class="statebar" aria-label="Preview commute scenario"><button onclick="period('morning')" class="${state.period==='morning'?'active':''}">Morning · 6:24 AM</button><button onclick="period('evening')" class="${state.period==='evening'?'active':''}">Return · 5:24 PM</button></div><span class="eyebrow">${profile?'YOUR EVERYDAY JOURNEY':'GOOD '+(state.period==='morning'?'MORNING':'EVENING')}</span><h1>${state.trip?'You’re on your way.':'Where are we headed?'}</h1><p class="sub">${state.trip?'We’ll help you follow the rest of your ride.':'Your stop. Your bus. All in one place.'}</p>${state.trip?activeCard():''}<form class="searchbox" onsubmit="event.preventDefault();searchTrip()"><label class="row">${ic('locate')}<span class="sr-only">Starting point</span><input id="from" value="${d.from}" aria-label="Starting point"><button type="button" aria-label="Use location" onclick="locate()">${ic('locate')}</button></label><label class="row">${ic('search')}<span class="sr-only">Destination</span><input id="to" placeholder="Where to?" aria-label="Destination" ${state.search?'value="'+d.to+'"':''}></label><button class="primary full" style="margin-top:8px">Find a journey ${ic('arrow')}</button></form><div class="chips"><button class="chip ${state.accessible?'selected':''}" aria-pressed="${state.accessible}" onclick="state.accessible=!state.accessible;render()">${ic('access')}Step-free bus</button><button class="chip" onclick="setTab('saved')">${ic('star')}Saved journeys</button></div>${state.search?`<div class="alert success"><b>Direct journey · CM05</b><br>4 min to the stop · 6 min until bus · about 54 min on board.<br><span class="tiny">Illustrative journey. Only the sample Battaramulla–Ekala corridor is connected.</span></div>`:''}${state.trip?'':`<section class="section"><div class="sectionhead between"><h2>Your next commute</h2><button class="textbtn" onclick="saveCommute()">${commutes.length?'Edit':'Save journey'}</button></div><div class="card commute"><div class="between"><span class="eyebrow">${state.period==='morning'?'OUTBOUND':'HEADING BACK'} · WEEKDAYS</span>${ic('star')}</div><h3 style="margin:13px 0 10px">${d.from} ${ic('arrow')} ${d.to}</h3><div class="between"><div><span class="depart">${state.period==='morning'?'6:30':'5:30'}</span><span class="tiny"> ${state.period==='morning'?'AM':'PM'}</span><div class="tiny">Leaves ${d.from}</div></div><button class="secondary" onclick="selectBus(0);document.getElementById('maparea').scrollIntoView({behavior:'smooth',block:'start'})">Follow bus ${ic('arrow')}</button></div></div></section>`}<section class="section"><div class="sectionhead between"><h2>${state.search?'Your bus options':'Near your stop'}</h2><span class="live"><span class="dot"></span> Simulated live</span></div><div class="stoplabel">${ic('walk')}<span><b>${d.from} Junction</b> · 280 m · 4 min walk<br><span class="tiny">Towards ${d.to} · stop access unverified</span></span></div>${routes.slice(0,2).filter(r=>!state.accessible||r.access).map((r)=>routeCard(r,routes.indexOf(r))).join('')}</section><div class="balance between"><span>${ic('wallet')} <b>Rs ${balance.toLocaleString()}</b><span class="tiny"> in your wallet</span></span><button class="textbtn" onclick="setTab('wallet')">Open wallet →</button></div><p class="tiny" style="margin-top:15px">Independent redesign · all locations, times, fares and availability shown are illustrative.</p>`}
function activeCard(){return `<div class="card tracking section"><div class="between"><span class="eyebrow">ON BOARD · ${routes[state.selected].bus}</span><span class="pill">Journey active</span></div><h2 style="margin:18px 0 8px">Next stop, Koswatta</h2><p class="sub">Towards ${dir(routes[state.selected]).to} · 8 stops to go</p><button class="primary full" style="margin-top:15px" onclick="showQR()">Show exit QR ${ic('arrow')}</button><button class="textbtn" style="color:white;width:100%" onclick="state.trip=false;render();toast('Sample journey ended. No fare was charged.')">End sample journey</button></div>`}
function render(){document.body.classList.toggle('large',large);$('#usericon').innerHTML=ic('user');$('#guestlabel').textContent=profile||'Explore as guest';$('#nav').innerHTML=[['explore','explore','Explore'],['routes','bus','Routes'],['saved','star','Saved'],['wallet','wallet','Wallet'],['account','user','Account']].map(([t,i,l])=>`<button class="${state.tab===t?'active':''}" aria-current="${state.tab===t?'page':'false'}" onclick="setTab('${t}')">${ic(i)}${l}</button>`).join('');$('#panel').innerHTML=state.tab==='explore'?home():state.tab==='routes'?routesPanel():state.tab==='saved'?savedPanel():state.tab==='wallet'?wallet():accountPanel();$('#maparea').classList.toggle('hiddenmobile',['wallet','account','saved'].includes(state.tab));renderMap()}
function routesPanel(){return `<span class="eyebrow">THE METRO NETWORK</span><h1>Find your way.</h1><p class="sub">Choose a route to see buses, stops and arrivals together.</p><div class="searchbox row">${ic('search')}<input placeholder="Route number or place" aria-label="Search routes" oninput="filterRoutes(this.value)"></div><div class="chips"><button class="chip ${state.accessible?'selected':''}" onclick="state.accessible=!state.accessible;render()">${ic('access')}Step-free bus</button><button class="chip" onclick="period(state.period==='morning'?'evening':'morning')">Reverse direction</button></div><div class="section" id="routeList">${routeList('')}</div>`}function routeList(q){let arr=routes.filter((r,i)=>i!==1&&(!state.accessible||r.access)&&[r.id,r.from,r.to,r.via].join(' ').toLowerCase().includes(q.toLowerCase()));return arr.length?arr.map(r=>routeCard(r,routes.indexOf(r))).join(''):'<p class="empty">No matching routes. Try another stop or route number.</p>'}function filterRoutes(q){$('#routeList').innerHTML=routeList(q)}
function savedPanel(){return `<span class="eyebrow">LESS SEARCHING, MORE GOING</span><h1>Your usual journeys.</h1><p class="sub">Keep both directions and departure reminders together.</p><div class="section">${commutes.length?commutes.map((c,i)=>`<div class="card"><div class="between"><h2>${c}</h2><button aria-label="Remove saved commute" class="close" onclick="commutes.splice(${i},1);persist();render()">${ic('close')}</button></div><p class="sub">Weekdays · CM05</p><div class="listrow between"><span>To Ekala<br><b>6:30 AM</b></span><button class="secondary" onclick="state.tab='explore';period('morning')">Follow</button></div><div class="listrow between"><span>To Battaramulla<br><b>5:30 PM</b></span><button class="secondary" onclick="state.tab='explore';period('evening')">Follow</button></div><button class="chip" onclick="remind=!remind;persist();render();toast('Reminder preference saved for this prototype. No push notification will be sent.')">${ic('bell')}${remind?'Reminder on · 15 min before':'Set a departure reminder'}</button></div>`).join(''):`<div class="card empty">${ic('star')}<h2 style="margin:15px 0 8px">Make tomorrow easier.</h2><p class="sub">Save your outbound and return buses as one commute.</p></div>`}<button class="primary full" onclick="saveCommute()">${ic('star')} Save a commute</button></div>`}
function saveCommute(){modal('Your everyday commute',`<p class="sub" style="margin-top:12px">Sample corridor: Battaramulla ↔ Ekala</p><label for="name">Journey name</label><input id="name" value="Work commute" maxlength="40"><div class="card" style="margin-top:18px"><div class="between"><b>Outbound</b><span>6:30 AM · weekdays</span></div><hr style="border:0;border-top:1px solid var(--line);margin:15px 0"><div class="between"><b>Return</b><span>5:30 PM · weekdays</span></div></div><button class="primary full" onclick="commitCommute()">Save both directions</button><p class="tiny" style="margin-top:12px">Saved on this browser. No account needed to try it.</p>`)}function commitCommute(){let n=$('#name').value.trim()||'Work commute';commutes=[n.replace(/[<>"']/g,'')];persist();closeModal();render();toast('Both directions saved. Find them in Saved.')}
function wallet(){return `<span class="eyebrow">READY WHEN YOU ARE</span><h1>Your wallet.</h1><p class="sub">A sample wallet to explore the boarding experience.</p><div class="card section"><div class="between"><span class="tiny">Available balance</span><span class="pill demo">Demo wallet</span></div><div class="amount">Rs ${balance.toLocaleString()}.00</div><div class="row"><button class="primary" style="flex:1" onclick="showQR()">Show boarding QR</button><button class="secondary" onclick="topup()">Top up</button></div></div><div class="section"><h2>Passes</h2><div class="card" style="margin-top:14px"><b>No active pass</b><p class="sub" style="margin:8px 0">Use wallet pay-as-you-go, or explore commuter passes.</p><button class="textbtn" onclick="passInfo()">View pass information →</button></div></div><div class="section"><h2>Activity</h2><div class="listrow"><div class="between"><b>Journey adjustment</b><b>− Rs 300</b></div><p class="sub">Battaramulla → Ekala · 6 Oct</p><p class="tiny">Exit scan not recorded. Sample automatic deduction.</p><button class="textbtn" onclick="chargeInfo()">Why was I charged? →</button></div><div class="listrow between"><span><b>Wallet top-up</b><p class="tiny">21 Sep · Sample transaction</p></span><b style="color:var(--green)">+ Rs 1,000</b></div></div>`}
function topup(){modal('Try a wallet top-up',`<p class="sub" style="margin-top:12px">Demo only. No payment details are collected.</p><label for="amount">Amount (Rs)</label><select id="amount"><option>500</option><option>1000</option><option>2000</option></select><button class="primary full" style="margin-top:20px" onclick="balance+=Number($('#amount').value);persist();closeModal();render();toast('Demo balance updated. No money was charged.')">Add demo funds</button>`)}function showQR(){modal(state.trip?'Ready to get off?':'Ready to board?',`<p class="sub" style="margin:15px 0">Present your code to the bus scanner when boarding and exiting.</p><div style="height:220px;border:2px dashed #9eafa5;display:grid;place-items:center;background:#f2f5ef;text-align:center"><div>${ic('wallet')}<h2 style="margin:12px 0">DEMO BOARDING CODE</h2><p class="tiny">No valid ticket or scannable QR<br>is issued by this prototype.</p></div></div><p class="sub" style="margin:15px 0">Sample balance <b>Rs ${balance}</b></p><button class="primary full" onclick="closeModal();state.trip=!state.trip;state.tab='explore';render();toast(state.trip?'Sample boarding confirmed. Active ride is now on Home.':'Sample exit confirmed. Journey ended.')">Simulate ${state.trip?'exit':'boarding'} scan</button>`)}
function account(){setTab('account')}function legacyAccountPanel(){return `<span class="eyebrow">YOUR METRO</span><h1>${profile?'Hello, '+profile+'.':'Everyone’s welcome.'}</h1><p class="sub">Explore routes, stops and buses without registering.</p><div class="card section"><h2>${profile?'Local demo profile':'You’re browsing as a guest'}</h2><p class="sub" style="margin:10px 0">Saved journeys work on this browser. An operator account would sync them across devices.</p><button class="secondary full" onclick="profileDialog()">${profile?'Edit demo profile':'Try a profile'}</button></div><div class="section"><h2>Accessibility & preferences</h2><div class="listrow between"><span><b>Larger text</b><p class="tiny">Increase supporting text size</p></span><button class="secondary" aria-pressed="${large}" onclick="large=!large;persist();render()">${large?'On':'Off'}</button></div><div class="listrow between"><span><b>Step-free buses</b><p class="tiny">Prefer buses with verified low-floor access</p></span><button class="secondary" aria-pressed="${state.accessible}" onclick="state.accessible=!state.accessible;render()">${state.accessible?'On':'Off'}</button></div><div class="alert">A low-floor bus does not guarantee an accessible journey. Stop access, working ramps and wheelchair-space availability must be confirmed separately.</div><div class="listrow"><b>Language</b><p class="sub">English · Prototype</p><p class="tiny">Sinhala and Tamil content require complete translation and layout testing before release.</p></div></div><button class="textbtn" onclick="aboutDialog()">About this independent concept</button>`}function saveProfile(){profile=$('#profileName').value.trim().replace(/[<>"']/g,'')||'Commuter';persist();closeModal();render()}
function locate(){toast('Prototype location: Battaramulla Junction. Device location is not requested.')}function searchTrip(){let f=$('#from').value.trim().toLowerCase(),t=$('#to').value.trim().toLowerCase();if(!t){$('#to').focus();toast('Enter a destination to find your bus.');return}if(!(f.includes('battaramulla')&&t.includes('ekala')||f.includes('ekala')&&t.includes('battaramulla'))){toast('This prototype connects Battaramulla ↔ Ekala. Explore all sample services in Routes.');return}state.period=f.includes('ekala')?'evening':'morning';state.search=true;state.selected=0;render()}
function report(){modal('How’s this bus right now?',`<p class="sub" style="margin:14px 0">${routes[state.selected].bus} · Share only if you’re on this bus. Passenger reports are shown separately from operator information.</p><label for="crowd">Crowding</label><select id="crowd"><option>Seats available</option><option>Standing room</option><option>Very crowded</option></select><label class="row" style="font-weight:400"><input type="checkbox" id="onbus" style="width:20px;min-height:20px"> I’m currently on this bus</label><button class="primary full" style="margin-top:16px" onclick="sendReport()">Share sample report</button><p class="tiny">Demo only. Nothing is sent to Metro Transit.</p>`)}function sendReport(){if(!$('#onbus').checked){toast('Confirm you’re on board before reporting.');return}reported=$('#crowd').value;persist();closeModal();render();toast('Your sample passenger report was added.')}
function renderMap(){let r=routes[state.selected],d=dir(r);let arrival=state.selected===0?state.arrival:'approaching';$('#maparea').innerHTML=`<div class="map" role="img" aria-label="Schematic sample map showing the selected bus approaching ${d.from}. Not for navigation.">${mapSvg(r)}</div><div class="maptop"><div class="map-switch" aria-label="Map display"><button class="${state.view==='map'?'active':''}" onclick="state.view='map';renderMap()">Map</button><button class="${state.view==='line'?'active':''}" onclick="state.view='line';renderMap()">Route line</button><button class="${state.view==='list'?'active':''}" onclick="state.view='list';renderMap()">Bus list</button></div><span class="mapkey"><span class="dot" style="color:var(--green)"></span> Sample GPS · updated just now</span></div>${state.view==='list'?`<div class="listmode"><h2>Buses on ${r.id}</h2><p class="sub" style="margin:10px 0 20px">Arrivals at ${d.from} · illustrative data</p>${(r.id==='CM05'?routes.slice(0,2):[r]).filter(x=>!state.accessible||x.access).map(x=>routeCard(x,routes.indexOf(x))).join('')}<button class="secondary full" onclick="state.view='map';renderMap()">Return to map</button></div>`:`<div class="mapbottom"><div class="detail"><div class="between"><span class="row"><span class="routebadge" style="background:${r.color}">${r.id}</span><b>${r.bus}</b></span><span class="live"><span class="dot"></span> ${arrival==='arrived'?'At your stop':arrival==='passed'?'Already departed':r.delay?'Delayed '+r.delay+' min':'Approaching your stop'}</span></div><h2>${state.trip?'On board to ':arrival==='arrived'?'Now at ':arrival==='passed'?'Departed from ':r.mins+' min to '}${state.trip?d.to:d.from}</h2><p class="tiny">Towards ${d.to} · ${time(r)} departure</p>${arrival==='passed'?'<div class="alert">This bus has passed your stop. Next CM05: <b>26 min</b>. <button class="textbtn" onclick="selectBus(1)">Follow next bus →</button></div>':''}<div class="chips" style="margin-top:10px" aria-label="Preview arrival state">${['approaching','arrived','passed'].map(a=>`<button class="chip ${arrival===a?'selected':''}" style="min-height:32px;font-size:10px" onclick="state.selected=0;state.arrival='${a}';render()">${a==='approaching'?'Approaching':a==='arrived'?'At stop':'Missed bus'}</button>`).join('')}</div><div class="timeline"><span class="station">${d.from==='Battaramulla'?'Pelawatte':'Previous stop'}<br><b>Passed</b></span><span class="station current">${d.from}<br><b>${arrival==='arrived'?'Now':arrival==='passed'?'Departed':r.mins+' min'}</b></span><span class="station">${d.from==='Ekala'?'Kadawatha':'Koswatta'}<br><b>${r.mins+8} min</b></span><span class="station">${d.to}<br><b>~54 min</b></span></div><div class="between"><span class="meta" style="margin:0">${ic('people')} ${r.crowd}</span><button class="textbtn" onclick="report()">Report crowding</button></div><p class="tiny">Operator sample · updated 1 min ago${reported?'<br>Your passenger report: '+reported+' · just now':''}</p><div class="meta" style="margin:10px 0">${ic('access')} ${r.access?'Low floor · ramp fitted':'Wheelchair access unverified'} · space unverified</div><div class="row"><button class="primary" onclick="remind=!remind;persist();render();toast('Arrival reminder '+(remind?'saved locally. Push notifications are not connected.':'removed.'))">${ic(remind?'check':'bell')}${remind?'Following this bus':'Remind me'}</button><button class="secondary" onclick="stopDetails()">Stop details</button></div></div><div class="controls"><button aria-label="Zoom in" onclick="state.zoom=Math.min(1.6,state.zoom+.2);renderMap()">+</button><button aria-label="Zoom out" onclick="state.zoom=Math.max(.8,state.zoom-.2);renderMap()">−</button><button aria-label="Centre map" onclick="state.zoom=1;renderMap();locate()">${ic('locate')}</button></div></div>`}<span class="map-note">Schematic map · illustrative positions · not for navigation</span>`}
function stopDetails(){let d=dir(routes[state.selected]);modal(d.from+' Junction',`<p class="sub" style="margin:15px 0">Board towards ${d.to}. Check the bus destination display before boarding.</p><div class="card"><div class="row">${ic('walk')}<b>280 m · about 4 min walk</b></div><p class="tiny">Illustrative distance from sample location</p></div><div class="alert"><b>Stop accessibility unverified</b><br>Kerb height, pavement access and ramp boarding space have not been confirmed.</div><p class="sub">Sample next bus: ${routes[state.selected].mins} minutes. If missed, the following CM05 is shown at 26 minutes.</p><button class="primary full" style="margin-top:20px" onclick="closeModal();toast('Walking directions need a connected maps service. This schematic cannot provide navigation.')">Walking directions</button>`)}
function schematicMapSvg(r){let d=dir(r),line=state.view==='line';let status=state.selected===0?state.arrival:'approaching';return `<svg viewBox="0 0 900 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="grid" width="90" height="90" patternUnits="userSpaceOnUse"><path d="M90 0H0V90" stroke="#d9e0d5" stroke-width="1" fill="none"/></pattern><filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".15"/></filter></defs><rect width="900" height="900" fill="${line?'#f5f7f1':'#e9ede5'}"/><g transform="translate(${450-450*state.zoom},${400-400*state.zoom}) scale(${state.zoom})">${line?'':`<rect width="900" height="900" fill="url(#grid)"/><g fill="#d7e2cb"><path d="M70 150h160l60 90-40 110H90Z"/><path d="M630 100h210v210l-140-20-60-90Z"/><path d="m580 405 200-20 80 160-200 30Z"/><path d="m80 500 170 30 20 120-170 60Z"/></g><path d="M-20 370C200 250 270 420 450 310S720 330 950 190" stroke="#b6d3ce" stroke-width="32" fill="none"/><g stroke="#fdfdf9" stroke-width="17" fill="none"><path d="M-10 180 900 680M100 0 540 900M-10 560 900 150M420-20 300 900M-10 750 900 410"/><path d="M-10 180 900 680M100 0 540 900M-10 560 900 150M420-20 300 900M-10 750 900 410" stroke="#d3d8ca" stroke-width="1"/></g><g font-family="Arial" font-size="12" fill="#66776b" letter-spacing="2"><text x="150" y="125">KADUWELA</text><text x="610" y="260">MALABE</text><text x="140" y="480">BATTARAMULLA</text><text x="620" y="530">THALAWATHUGODA</text><text x="380" y="190" font-size="10" fill="#517f7c" transform="rotate(-12 380 190)">Kelani River</text><text x="100" y="330" font-size="10">Diyatha Park</text></g>`}<path d="${line?'M240 150V420Q240 450 270 450H550Q590 450 590 490V690':'M280 770V510Q280 470 320 470H470Q510 470 510 430V200Q510 160 550 160H780'}" fill="none" stroke="white" stroke-width="13"/><path d="${line?'M240 150V420Q240 450 270 450H550Q590 450 590 490V690':'M280 770V510Q280 470 320 470H470Q510 470 510 430V200Q510 160 550 160H780'}" fill="none" stroke="${r.color}" stroke-width="6" stroke-linecap="round"/><g fill="white" stroke="${r.color}" stroke-width="3">${(line?[[240,150],[240,300],[300,450],[470,450],[590,550]]:[[280,650],[280,530],[390,470],[510,350],[510,230],[650,160]]).map(([x,y])=>`<circle cx="${x}" cy="${y}" r="6"/>`).join('')}</g><g font-family="Arial" font-size="13" fill="#253c33"><text x="${line?265:300}" y="${line?155:540}" font-weight="bold">${d.from}</text><text x="${line?265:530}" y="${line?300:350}">${d.from==='Ekala'?'Kadawatha':'Koswatta'}</text><text x="${line?610:665}" y="${line?555:150}" font-weight="bold">Towards ${d.to}</text></g><g transform="translate(${line?240:510},${line?230:285})" filter="url(#shadow)"><rect x="-24" y="-24" width="48" height="48" rx="12" fill="${r.color}" stroke="white" stroke-width="3"/><use href="#i-bus" x="-13" y="-13" width="26" height="26" stroke="white" fill="none" stroke-width="1.7"/><rect x="34" y="-20" width="120" height="40" rx="5" fill="white"/><text x="46" y="-3" font-family="Arial" font-size="12" font-weight="bold" fill="#20382d">${r.bus} · ${status==='arrived'?'Here':status==='passed'?'Left':r.mins+' min'}</text><text x="46" y="12" font-family="Arial" font-size="10" fill="#5a7063">Simulated position</text></g><circle cx="${line?205:235}" cy="${line?150:500}" r="22" fill="#1c76d0" opacity=".13"/><circle cx="${line?205:235}" cy="${line?150:500}" r="8" fill="#1c76d0" stroke="white" stroke-width="3"/></g></svg>`}
function passInfo(){modal('Commuter passes',`<p class="sub" style="margin-top:20px">Pass prices and eligibility need confirmation from Metro Transit. This concept does not invent purchasable products.</p><button class="secondary full" onclick="closeModal()">Back to wallet</button>`)}
function chargeInfo(){modal('Journey charge',`<p class="sub" style="margin-top:20px">The sample journey has no recorded exit scan. A production app should show the applicable fare rule, scan history and a support case reference.</p><button class="primary full" style="margin-top:20px" onclick="closeModal();toast('Sample support request recorded locally. Nothing was sent.')">Try reporting a fare issue</button>`)}
function profileDialog(){modal('Try a local profile',`<p class="sub" style="margin-top:15px">This is a prototype profile, not LMT Go registration.</p><label for="profileName">First name</label><input id="profileName" maxlength="25" placeholder="Your first name"><button class="primary full" style="margin-top:20px" onclick="saveProfile()">Continue locally</button>`)}
function aboutDialog(){modal('About this concept',`<p class="sub" style="margin-top:20px">An independent LMT Go redesign for review. No connection to operator accounts, GPS, payments or notifications. All operational data is illustrative. Saved preferences remain in this browser.</p>`)}
</script><script src="experience.js"></script><script src="planner-engine.js"></script><script src="journey-planner.js"></script><script src="network-data.js"></script><script src="network-engine.js"></script><script src="network-experience.js"></script><script src="arrival-engine.js"></script><script src="arrivals.js"></script><script src="radar.js"></script><script src="stop-sheet.js"></script><script src="progress-engine.js"></script><script src="journey-progress.js"></script><script src="glass-journey.js"></script><script src="simulator-bridge.js"></script></body></html>
